; containers.ini - every container a recipe can name
; Type=station  a world object you walk to and click
;   At<n>=<zone> <y> <x> <z>   one line per physical station (merchant scanner adds these)
;   Target<n>=   clickable name for that station, only when it differs from the section name
; Names=        other names recipe pages use for it (read by tools/parse_harvest.py)
; Skill=        the tradeskill of a recipe made in it, for recipes whose data has no Skill (the old ones)
; Type=skip     recipes made only in these are not wanted: tools/parse_harvest.py leaves them out
; Type=kit      a bag that goes in a pack slot
;   Accepts=     every bag that works as this kit, best first
;   BuyOrder=    which to buy when none is held, best first (missing = cannot be bought)

