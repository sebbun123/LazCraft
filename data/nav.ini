; nav.ini - ways around geometry that wedges a straight /nav, per zone (all from the old LazCraft, proven in game).
; Every spot is "y x z", the /loc order. Every walk in a zone listed here goes through these rules.
;
; Hub<n>=y x z radius
;     A destination within radius of a hub is walked to THROUGH the hub (the last approach comes from clear
;     ground). Standing within a hub's radius, a walk elsewhere leaves through that hub first.
; SideDocks=y x z | y x z [| near]
;     The zone is split in two by X (below 0 / above 0) with a band of pillars between. A walk from one side to
;     the other goes to this side's dock, then the other side's dock, then on. With near given, only when we
;     stand within near of this side's dock. (The walk off the zone-in to travel.ini's [Arrive] NPC is
;     always straight.)
; Pocket=hub y x z | dock y x z | split X | upper Z      PocketNpcs=names
;     A pocket of merchants cut off by a station cluster: in the pocket = X below split and Z above upper.
;     Going to one of PocketNpcs from outside: hub, then dock. Leaving the pocket: dock, then hub.
; Bridge=near y x z | far y x | heading
;     The mesh is broken across a bridge: when a walk has no path from here, walk to the near edge, face the
;     heading and run until the far edge (within 10), crouching and standing in turn when stuck; then walk on.
; Spot<n>=y x z radius [crouch]
;     A merchant within radius of the spot is opened from the spot (no climbing onto the counter).
; Avoid<n>=y x [z], y x [z], y x [z], y x [z] [| margin]
;     A box (its corners, in order round it) no walk goes through: standing in it, step out to its nearest edge
;     first; a stretch that would cross it goes round by its corners (pushed out by margin, 10 if not given),
;     the shorter way. Applies to the walk off the zone-in too. With z on the corners (the /loc's third number),
;     the walk round goes at that floor height; without, at a height between the walk's two ends.

