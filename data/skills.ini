; skills.ini - one section per tradeskill
; ID=          the tradeskill id the recipe data uses
; EQSkill=     the in-game skill name, only when it differs from the section name
; Class= / Race=   who can use it (hidden for everyone else)
; Disposal=    default for finished items when it is not Sell
; Trophy=      cap trophies, best first; the best one you own goes in the Ammo slot
; Clicky=      leveling aids, best first; optional
; Rung<n>=     leveling path in trivial order: <recipe>, <sell|destroy|keep>

