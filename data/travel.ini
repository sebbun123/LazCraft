; travel.ini - how to get from one zone to another, one section per hop: [<from>><to>]
; <from> may be * (from anywhere). How=aa | say | door | run
;   aa:   AA=<ability name>
;   say:  Npc=<porter>  Say=<keyword>        (nav to the porter, target, /say)
;   door: Door=<door name>  [Near=<y x z>]   (nav near it - no Near: the door's own spot - /doortarget, /click left door)
;   run:  Near=<y x z>  Heading=<h>          (nav to Near, face the heading, run forward until the zone line)
; ; Northern Felwithe: the Kelethin stone in PoK, then Greater Faydark's zone line (the old LazCraft's route)
[poknowledge>gfaydark]
How=door
Door=POKKELPORT500

[gfaydark>felwithea]
How=run
Near=-1935.80 -2590.65 25.74
Heading=272.56

